<style>
  /* 色はここだけで管理する。値は計算ツールと共通（DESIGN.md）。og 画像も同じ #1d5c96 を基調にする */
  :root {

    --ink: #15212c;

      --muted: #7d8996;
      --line: #2b3641;
      --accent: #6ba6df;
      --accent-weak: #1c2f43;
      --ok: #57c483;
      --ok-weak: #163222;
      --fig: #6ba6df;
      --fig-weak: rgba(107, 166, 223, .16);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11161b;
    --panel: #19212a;
    --ink: #e6ecf2;
    --ink2: #a9b5c1;
    --muted: #7d8996;
    --line: #2b3641;
    --accent: #6ba6df;
    --accent-weak: #1c2f43;
    --ok: #57c483;
    --ok-weak: #163222;

  body {
    margin: 0;
    background: var(--bg);

  /* 目次からの移動をなめらかにする（動きを減らす設定のときは瞬時に移動） */

  h3 a:focus-visible { outline: none; }

  /* 規格番号・記号は等幅、日本語の手法名は本文の字体（等幅の代替字体で字間が開くのを避ける） */
  .std .code { font-family: var(--f-num); letter-spacing: .01em; }
  .std .jp { font-family: var(--f-ui); }

  .sub { display: contents; }
  .sub a {

  .sub a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

  /* 行の右端の「›」（開けることを示す） */
  .go { color: var(--muted); font-size: 1.6rem; line-height: 1; text-align: center; }
  .row::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--accent); transform: scaleY(0); transition: transform .15s ease;
  }
  .go { transition: transform .15s ease, color .15s; }
  .row:has(h3 a:focus-visible)::before { transform: scaleY(1); }
  .row:has(h3 a:focus-visible) .go { transform: translateX(3px); color: var(--accent); }
  @media (hover: hover) {
    .row:hover::before { transform: scaleY(1); }
    .row:hover .go { transform: translateX(3px); color: var(--accent); }
  }
  @media (prefers-reduced-motion: reduce) {
    .row::before, .go { transition: none; }

    header { padding-top: 40px; }
    h1 { font-size: 1.7rem; }

    /* スマホ：図を見出しの左に小さく置き、説明文は行の全幅に広げる */

    .go { grid-column: 3; grid-row: 1 / 4; align-self: center; font-size: 1.3rem; }
    .sub a:first-child { margin-left: 0; }
  }
</style>

<script>
// ===== ツール一覧（追加・修正はこの配列だけ編集する） =====
// section : 表示するグループ（groups のキー）
// fig     : 行の左に描く図（figs のキー）
// open    : ツール本体のURL
// repo    : GitHubリポジトリのURL
// android : Android版の配布ページ（無ければ省略）
// std     : 準拠規格・主な手法（短く）
const groups = {
  calc:  { title: "計算ツール" },
  drill: { title: "問題集",     note: "計算問題は毎回数値が変わります。間隔反復による復習つき" },
  other: { title: "その他" }
};

const tools = [
  {
    section: "calc", fig: "cap",
    name: "工程能力解析",
    desc: "Excel・CSVの測定データからCp・Cpk・Pp・Ppk、管理図、ヒストグラム、F検定・t検定・相関、必要データ数の見積もり",
    std: ["Cp / Cpk / Pp / Ppk", "AIAG SPC", "JIS Z 9020-2管理図"],
    open: "https://kotaooka.github.io/cpk-calc/",
    repo: "https://github.com/kotaooka/cpk-calc"
  },
  {
    section: "calc", fig: "gauge",
    name: "測定システム解析",
    desc: "ゲージR&R（ANOVA法・平均範囲法）で繰り返し性・再現性を分け、%GRRとndcを判定。偏り・直線性・安定性、Type-1（Cg・Cgk）、計数値のκ・有効性を評価",
    std: ["AIAG MSA第4版", "%GRR / ndc / κ", "Type-1 Cg / Cgk（AIAG外）"],
    open: "https://kotaooka.github.io/msa-calc/",
    repo: "https://github.com/kotaooka/msa-calc"
  },
  {
    section: "calc", fig: "logit",
    name: "2値データの要因解析",
    desc: "合否・発生の有無のような2値の結果と測定値の関係をロジスティック回帰で解析。効いている変数、確率の地図、目標の確率になる条件の逆算",
    std: ["ロジスティック回帰", "Firth法", "オッズ比 / AUC"],
    open: "https://kotaooka.github.io/logit-calc/",
    repo: "https://github.com/kotaooka/logit-calc"
  },
  {
    section: "calc", fig: "doe",
    name: "実験計画法",
    desc: "直交表への割り付けから実験順序表、分散分析・要因効果図、最適条件の推定まで。タグチメソッドのSN比・2段階設計・確認実験にも対応",
    std: ["直交表L4〜L18", "擬水準法", "SN比"],
    open: "https://kotaooka.github.io/doe-calc/",
    repo: "https://github.com/kotaooka/doe-calc"
  },
  {
    section: "calc", fig: "oc",
    name: "抜取検査計算機",
    desc: "合格確率、AQL方式のn・c、OC曲線での方式の比較と逆設計、不良率の区間推定",
    std: ["MIL-STD-105E", "JIS Z 9015-1と一部差", "超幾何分布 / Clopper-Pearson"],
    open: "https://kotaooka.github.io/sampling-calc/",
    repo: "https://github.com/kotaooka/sampling-calc"
  },
  {
    section: "calc", fig: "stack",
    name: "公差積み上げ計算",
    desc: "寸法チェーンをブロック図で組み、ワーストケース・RSS・補正RSS・モンテカルロで評価。2次元ベクトルループと幾何公差にも対応",
    std: ["WC / RSS / MC", "位置度 Ⓜ"],
    open: "https://kotaooka.github.io/stackup-calc/",
    repo: "https://github.com/kotaooka/stackup-calc"
  },
  {
    section: "calc", fig: "lab",
    name: "色差累積ビューア",
    desc: "試料A → B → C … と色を引き継いだときの各段と累積の色差、ずれの向き、許容差の余裕を図示。2色の中間色も計算。5角度とフロップインデックスにも対応",
    std: ["CIE76 / CIE94 / CMC", "CIEDE2000", "FI"],

    std: ["QC検定2級"],
    open: "https://kotaooka.github.io/qc2-drill/",

    desc: "辺の長さ・角度から一般三角形と直角三角形を解き、面積・高さ・外接円まで。勾配・テーパーの換算、座標からの距離と角度の計算。図の頂点をドラッグして形を変えられる",
    std: ["正弦・余弦定理", "勾配 / テーパー", "度分秒"],

// ===== 行の左に描く図（viewBox 132×88、色は currentColor） =====
const W = 132, H = 88;
const normal = (x, m, s) => Math.exp(-(((x - m) / s) ** 2) / 2);
const path = pts => "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L");

const figs = {
  // 工程能力：ヒストグラムと分布曲線、規格線
  cap() {
    const base = 78, m = 66, s = 15, amp = 58;
    let bars = "";
    for (let i = -4; i < 4; i++) {
      const x0 = m + i * 10, h = amp * 0.9 * normal(x0 + 5, m, s);
      bars += `<rect x="${x0 + 1}" y="${base - h}" width="8" height="${h}" fill="var(--fig-weak)"/>`;
    }
    const curve = [];
    for (let x = 18; x <= 114; x += 2) curve.push([x, base - amp * normal(x, m, s)]);
    return `${bars}<path d="${path(curve)}" fill="none" stroke="currentColor" stroke-width="2"/>
      <line x1="8" y1="${base}" x2="124" y2="${base}" stroke="currentColor" stroke-opacity=".4"/>
      <line x1="22" y1="10" x2="22" y2="${base}" stroke="currentColor" stroke-dasharray="3 3" stroke-opacity=".7"/>
      <line x1="112" y1="10" x2="112" y2="${base}" stroke="currentColor" stroke-dasharray="3 3" stroke-opacity=".7"/>`;
  },
  // 測定システム解析：%GRR の目盛り（合格・条件付き・不合格の区間）と針
  gauge() {
    const cx = 66, cy = 70, R = 52;
    const pt = (deg, r) => [cx + r * Math.cos(deg * Math.PI / 180), cy - r * Math.sin(deg * Math.PI / 180)];
    // 180°（左端）〜 0°（右端）を %GRR 0〜50% に対応させる
    const ang = v => 180 - v / 50 * 180;
    const arc = (v0, v1, r) => { const a = pt(ang(v0), r), b = pt(ang(v1), r); return `M${a[0].toFixed(1)} ${a[1].toFixed(1)}A${r} ${r} 0 0 1 ${b[0].toFixed(1)} ${b[1].toFixed(1)}`; };
    let ticks = "";
    for (let v = 0; v <= 50; v += 5) { const a = pt(ang(v), R - (v % 10 ? 5 : 9)), b = pt(ang(v), R); ticks += `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="currentColor" stroke-width="${v % 10 ? 1 : 1.5}" stroke-opacity="${v % 10 ? .5 : .8}"/>`; }
    const n = pt(ang(22), R - 14);
    return `<path d="${arc(0, 50, R)}" fill="none" stroke="currentColor" stroke-opacity=".4"/>
      <path d="${arc(10, 30, R - 18)}" fill="none" stroke="var(--fig-weak)" stroke-width="10"/>
      <path d="${arc(0, 10, R - 18)}" fill="none" stroke="currentColor" stroke-width="10" stroke-opacity=".55"/>
      ${ticks}
      <line x1="${cx}" y1="${cy}" x2="${n[0].toFixed(1)}" y2="${n[1].toFixed(1)}" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="4.5" fill="var(--panel)" stroke="currentColor" stroke-width="1.8"/>
      <line x1="8" y1="${cy + 8}" x2="124" y2="${cy + 8}" stroke="currentColor" stroke-opacity=".4"/>`;
  },
  // 2値データ：0 と 1 に並ぶ観測点と、確率の S 字曲線
  logit() {
    const x0 = 10, x1 = 122, top = 14, bot = 74;
    const curve = [];
    for (let i = 0; i <= 60; i++) { const u = i / 60; curve.push([x0 + (x1 - x0) * u, bot - (bot - top) / (1 + Math.exp(-(u - 0.55) * 11))]); }
    const lo = [16, 28, 38, 50, 62, 80], hi = [56, 74, 88, 98, 108, 118];
    return `<line x1="${x0}" y1="${bot}" x2="${x1}" y2="${bot}" stroke="currentColor" stroke-opacity=".4"/>
      <line x1="${x0}" y1="${top}" x2="${x1}" y2="${top}" stroke="currentColor" stroke-dasharray="3 3" stroke-opacity=".4"/>
      <path d="${path(curve)}" fill="none" stroke="currentColor" stroke-width="2"/>
      ${lo.map(x => `<circle cx="${x}" cy="${bot + 7}" r="2.8" fill="var(--panel)" stroke="currentColor" stroke-width="1.4"/>`).join("")}
      ${hi.map(x => `<circle cx="${x}" cy="${top - 7}" r="2.8" fill="var(--fig-weak)" stroke="currentColor" stroke-width="1.4"/>`).join("")}`;
  },
  // 実験計画法：要因効果図（3 因子 × 3 水準、良い水準を強調。右端はプールした因子）
  doe() {
    const panels = [[54, 42, 34], [66, 40, 16], [42, 46, 40]], pw = 38, x0 = 9, top = 8, bot = 76;
    let s = `<line x1="${x0}" y1="44" x2="${x0 + pw * 3}" y2="44" stroke="currentColor" stroke-dasharray="3 3" stroke-opacity=".5"/>`;
    panels.forEach((ys, i) => {
      const px = j => x0 + i * pw + pw * (j + 0.5) / 3;
      if (i) s += `<line x1="${x0 + i * pw}" y1="${top}" x2="${x0 + i * pw}" y2="${bot}" stroke="currentColor" stroke-opacity=".25"/>`;
      const pooled = i === 2, best = ys.indexOf(Math.min(...ys));
      s += `<path d="${path(ys.map((y, j) => [px(j), y]))}" fill="none" stroke="currentColor" stroke-width="${pooled ? 1.2 : 2}"${pooled ? ' stroke-dasharray="3 2" stroke-opacity=".55"' : ""}/>`;
      s += ys.map((y, j) => `<circle cx="${px(j).toFixed(1)}" cy="${y}" r="${j === best && !pooled ? 3.8 : 2.6}" fill="${j === best && !pooled ? "var(--fig-weak)" : "var(--panel)"}" stroke="currentColor" stroke-width="1.5"${pooled ? ' stroke-opacity=".55"' : ""}/>`).join("");
    });
    return s + `<line x1="${x0}" y1="${bot + 4}" x2="${x0 + pw * 3}" y2="${bot + 4}" stroke="currentColor" stroke-opacity=".4"/>`;
  },
  // 抜取検査：2つの方式の OC 曲線
  oc() {
    const x0 = 12, y0 = 80, w = 112, h = 68, pmax = 0.12;
    const comb = (n, k) => { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return r; };
    const pa = (n, c, p) => { let s = 0; for (let k = 0; k <= c; k++) s += comb(n, k) * p ** k * (1 - p) ** (n - k); return s; };
    const line = (n, c) => { const pts = []; for (let i = 0; i <= 60; i++) { const p = i / 60 * pmax; pts.push([x0 + w * p / pmax, y0 - h * pa(n, c, p)]); } return path(pts); };
    return `<path d="M${x0} ${y0 - h - 4}V${y0}H${x0 + w}" fill="none" stroke="currentColor" stroke-opacity=".4"/>
      <path d="${line(50, 1)}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity=".5"/>
      <path d="${line(125, 3)}" fill="none" stroke="currentColor" stroke-width="2"/>`;
  },
  // 公差積み上げ：部品 A・B・C とハウジング D、すき間
  stack() {
    const r = (x, y, w, s, fill) => `<rect x="${x}" y="${y}" width="${w}" height="24" rx="3" fill="${fill}" stroke="currentColor" stroke-width="1.5"/>
      <text x="${x + w / 2}" y="${y + 16.5}" text-anchor="middle" font-size="11" font-family="var(--f-num)" fill="currentColor">${s}</text>`;
    return r(8, 18, 34, "A", "none") + r(45, 18, 26, "B", "none") + r(74, 18, 30, "C", "none") +
      `<rect x="107" y="18" width="17" height="24" fill="var(--fig-weak)" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2"/>` +
      r(8, 50, 116, "D", "var(--fig-weak)");
  },
  // 色差：a*b* 平面の許容範囲と、ターゲット → 承認塗板 → 製品 の矢印
  lab() {
    const t = [40, 62], p = [66, 42], x = [92, 22], r = 4.5;
    const seg = (a, b, w, dash) => {
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]), ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L, g = r + 2;
      const e = [b[0] - ux * g, b[1] - uy * g], hb = [e[0] - ux * 6, e[1] - uy * 6];
      return `<path d="M${a[0] + ux * g} ${a[1] + uy * g}L${hb[0]} ${hb[1]}" stroke="currentColor" stroke-width="${w}"${dash ? ' stroke-dasharray="3 2" stroke-opacity=".55"' : ""}/>
        <path d="M${e[0]} ${e[1]}L${hb[0] + uy * 3.5} ${hb[1] - ux * 3.5}L${hb[0] - uy * 3.5} ${hb[1] + ux * 3.5}Z" fill="currentColor"${dash ? ' fill-opacity=".55"' : ""}/>`;
    };
    return `<ellipse cx="${t[0] + 14}" cy="${t[1] - 18}" rx="44" ry="36" fill="var(--fig-weak)" stroke="currentColor" stroke-dasharray="4 3" stroke-opacity=".7"/>
      <line x1="10" y1="${t[1]}" x2="124" y2="${t[1]}" stroke="currentColor" stroke-opacity=".4"/>
      <line x1="${t[0]}" y1="4" x2="${t[0]}" y2="84" stroke="currentColor" stroke-opacity=".4"/>
      ${seg(t, p, 2)}${seg(p, x, 2)}
      ${[t, p, x].map(q => `<circle cx="${q[0]}" cy="${q[1]}" r="${r}" fill="var(--panel)" stroke="currentColor" stroke-width="1.8"/>`).join("")}`;
  },
  // QC2級：管理図（中心線・管理限界と打点）
  chart() {
    const ys = [44, 36, 50, 41, 30, 47, 55, 39, 45, 33, 48, 42];
    const pts = ys.map((y, i) => [12 + i * 10, y]);
    return `<line x1="8" y1="14" x2="124" y2="14" stroke="currentColor" stroke-dasharray="4 3" stroke-opacity=".7"/>
      <line x1="8" y1="44" x2="124" y2="44" stroke="currentColor" stroke-opacity=".4"/>
      <line x1="8" y1="74" x2="124" y2="74" stroke="currentColor" stroke-dasharray="4 3" stroke-opacity=".7"/>
      <path d="${path(pts)}" fill="none" stroke="currentColor" stroke-width="1.5"/>
      ${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="var(--panel)" stroke="currentColor" stroke-width="1.5"/>`).join("")}`;
  },
  // PDF圧縮：上下から押し縮められる書類
  pdf() {
    const x = 44, y = 26, w = 44, h = 36, f = 10;
    const arrow = (tip, dir) => {
      const b = tip - dir * 9;
      return `<path d="M66 ${tip}L59 ${b}H73Z" fill="currentColor"/><path d="M66 ${b}V${b - dir * 8}" stroke="currentColor" stroke-width="3"/>`;
    };
    return `<path d="M${x} ${y}H${x + w - f}L${x + w} ${y + f}V${y + h}H${x}Z" fill="var(--panel)" stroke="currentColor" stroke-width="1.5"/>
      <path d="M${x + w - f} ${y}V${y + f}H${x + w}" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="${x - 6}" y="${y + 18}" width="34" height="13" rx="2" fill="var(--fig-weak)" stroke="currentColor" stroke-width="1.2"/>
      <text x="${x + 11}" y="${y + 28}" text-anchor="middle" font-size="10" font-weight="700" font-family="var(--f-num)" fill="currentColor">PDF</text>
      <path d="M${x + 7} ${y + 8}H${x + 24}M${x + 7} ${y + 13}H${x + 30}" stroke="currentColor" stroke-opacity=".5" stroke-width="1.5"/>
      ${arrow(y - 3, 1)}${arrow(y + h + 3, -1)}`;
  },
  // 三角形：方眼の上の三角形と角の弧
  tri() {
    const A = [58, 14], B = [26, 74], C = [106, 74];
    const r = 14, a1 = Math.atan2(A[1] - B[1], A[0] - B[0]);
    const arc = `M${B[0] + r} ${B[1]}A${r} ${r} 0 0 0 ${(B[0] + r * Math.cos(a1)).toFixed(1)} ${(B[1] + r * Math.sin(a1)).toFixed(1)}`;
    return `<path d="M${A}L${B}L${C}Z" fill="var(--fig-weak)" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="${arc}" fill="none" stroke="currentColor" stroke-width="1.5"/>
      ${[A, B, C].map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--panel)" stroke="currentColor" stroke-width="1.5"/>`).join("")}`;
  },
  // 幾何公差：位置度の公差記入枠（⌖ | ⌀0.1 Ⓜ | A | B）
  fcf() {
    const y = 30, h = 28;
    const cell = [0, 28, 86, 106, 126];
    const x = 3;
    let s = `<rect x="${x}" y="${y}" width="${cell[4]}" height="${h}" fill="var(--panel)" stroke="currentColor" stroke-width="1.5"/>`;
    for (const c of cell.slice(1, 4)) s += `<line x1="${x + c}" y1="${y}" x2="${x + c}" y2="${y + h}" stroke="currentColor" stroke-width="1.5"/>`;
    const cx = x + 14, cy = y + h / 2;  // 位置度の記号
    s += `<circle cx="${cx}" cy="${cy}" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M${cx - 10} ${cy}H${cx + 10}M${cx} ${cy - 10}V${cy + 10}" stroke="currentColor" stroke-width="1.5"/>`;
    const t = (tx, str) => `<text x="${x + tx}" y="${y + 18.5}" text-anchor="middle" font-size="12" font-family="var(--f-num)" fill="currentColor">${str}</text>`;
    s += t(57, "⌀0.1 Ⓜ") + t(96, "A") + t(116, "B");
    return s;
  }
};

// ===== 表示テーマの切り替え =====
(() => {
  const THEMES = ["auto", "light", "dark"];
  const LABEL = { auto: "表示：自動", light: "表示：ライト", dark: "表示：ダーク" };
  const btn = document.getElementById("themeBtn");
  const THEME_KEY = "qc-workbench-theme";
  const readTheme = () => { try { const t = localStorage.getItem(THEME_KEY); return THEMES.includes(t) ? t : "auto"; } catch (e) { return "auto"; } };
  let theme = readTheme();
  const apply = t => {
    if (t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.dataset.theme = t;
    btn.textContent = LABEL[t];
  };
  btn.addEventListener("click", () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* 保存できなくても切り替えは効く */ }
    apply(theme);
  });
  // 別のタブや別のツールで切り替えたら、このページにも反映する
  window.addEventListener("storage", e => { if (e.key === THEME_KEY || e.key === null) { theme = readTheme(); apply(theme); } });
  apply(theme);
})();

// ===== 描画（ここから下は通常いじらない） =====
// テキストはすべて textContent で入れる（HTMLとして解釈させない）
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function link(href, text) {
  const a = el("a", null, text);
  a.href = href;
  return a;
}

const app = document.getElementById("app");
for (const [key, g] of Object.entries(groups)) {
  const list = tools.filter(t => t.section === key);
  if (list.length === 0) continue;

  const sec = el("section");
  sec.id = key;
  // 目次に足す
  const li0 = el("li"); const a0 = link("#" + key, g.title); a0.append(el("span", "n", String(list.length))); li0.append(a0);
  document.getElementById("toc").append(li0);
  const head = el("div", "group-head");
  head.append(el("h2", null, g.title));
  if (g.note) head.append(el("p", "group-note", g.note));
  sec.append(head);

  const ul = el("ul", "list");
  for (const t of list) {
    const li = el("li", "row");

    const fig = el("div", "fig");
    fig.setAttribute("aria-hidden", "true");
    if (figs[t.fig]) fig.innerHTML = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${figs[t.fig]()}</svg>`;
    li.append(fig);

    const body = el("div", "body");
    const h3 = el("h3");
    h3.append(link(t.open, t.name));
    body.append(h3);
    body.append(el("p", "desc", t.desc));
    const meta = el("div", "meta");
    if (t.std && t.std.length) {
      // 規格番号の途中で折り返さないよう、項目ごとに span で包む。日本語を含む項目は本文の字体にする
      const std = el("p", "std");
      for (const v of t.std) std.append(el("span", /[\u3040-\u30ff\u4e00-\u9fff]/.test(v) ? "jp" : "code", v));
      meta.append(std);
    }
    const sub = el("span", "sub");
    if (t.android) sub.append(link(t.android, "Android版"));
    sub.append(link(t.repo, "GitHub"));
    meta.append(sub);
    body.append(meta);
    li.append(body);

    const go = el("span", "go", "›");
    go.setAttribute("aria-hidden", "true");
    li.append(go);

    ul.append(li);
  }
  sec.append(ul);
  app.append(sec);
}
